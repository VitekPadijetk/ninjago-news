name: Ninjago YouTube notifier

on:
  schedule:
    - cron: "*/5 * * * *"    # každých 5 minut - minimum, které GitHub Actions dovoluje
  workflow_dispatch:          # možnost spustit ručně přes GitHub UI (Actions -> Run workflow)

permissions:
  contents: write            # potřeba, aby workflow mohl commitnout stav zpět do repa

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zkontroluj nová videa a případně pošli notifikaci
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python ninjago_notifier.py

      - name: Ulož aktualizovaný stav zpět do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_videos.json
          git diff --staged --quiet || git commit -m "Aktualizace stavu sledovaných videí"
          git push
